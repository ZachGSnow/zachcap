name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Windows only: audio capture uses WASAPI (PyAudioWPatch) and keys live in Windows
# Credential Manager, so there is no Linux build to test.
jobs:
  engine:
    name: engine (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # The GPU speech stack is a few GB and not needed for the unit tests.
      - run: uv sync --no-group ml
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q

  desktop:
    name: desktop UI (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  shell:
    name: tauri shell (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # tauri::generate_context! embeds the built frontend, so give it a dist folder.
      - run: New-Item -ItemType Directory -Force ../dist | Out-Null
        shell: pwsh
      - run: cargo check --locked

  # Single stable check name for branch protection; fails unless every job passed.
  ci:
    name: ci
    needs: [engine, desktop, shell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          test "${{ needs.engine.result }}" = "success"
          test "${{ needs.desktop.result }}" = "success"
          test "${{ needs.shell.result }}" = "success"
