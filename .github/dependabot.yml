version: 2
updates:
  - package-ecosystem: uv
    directory: /engine
    schedule:
      interval: monthly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # torch comes from the CUDA 12.8 index, which trails PyPI, so Dependabot can't
      # resolve PyPI's newest version there. Bump both by hand together with that index.
      - dependency-name: torch
      - dependency-name: torchaudio
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
