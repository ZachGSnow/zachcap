[project]
name = "zachcap"
version = "0.2.0"
description = "ZachCap engine: meeting capture, local transcription, diarization and voiceprints."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Zach Snow" }]
dependencies = [
    "anthropic>=2.0",
    "av>=14",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "fastapi>=0.115",
    "keyring>=25",
    "mcp>=1.20",
    "numpy>=2.1",
    "pillow>=11",
    "pyaudiowpatch>=0.2.12",
    "scipy>=1.14",
    "soundfile>=0.13",
    "uvicorn>=0.32",
    "winrt-runtime>=3 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3 ; sys_platform == 'win32'",
    "winrt-windows-globalization>=3 ; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=3 ; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=3 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3 ; sys_platform == 'win32'",
]

[project.scripts]
zachcap = "zachcap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# GPU speech stack. Installed by default locally; CI skips it with --no-group ml.
ml = [
    "torch>=2.8",
    "torchaudio>=2.8",
    "faster-whisper>=1.2",
    "pyannote.audio>=4.0",
]

[tool.uv]
default-groups = ["dev", "ml"]

# torch must come from a CUDA 12.x build: CTranslate2 (faster-whisper) loads the
# cuBLAS 12 / cuDNN 9 DLLs that ship inside these wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zachcap"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
